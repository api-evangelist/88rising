aid: 88rising
name: 88rising
description: '88rising (stylized 88 with a rising arrow) is an American mass media company
  and record label founded in 2015 by Sean Miyashiro, headquartered in Los Angeles and New
  York with a division in Shanghai. It describes itself as a hybrid management, record label,
  video production and marketing company, and is known for building a global platform for
  Asian and Asian American artists including Rich Brian, NIKI, Joji and Keith Ape. Beyond
  recorded music it operates the Head in the Clouds festival franchise and the 88 Night
  Market live and commerce brand. It is a media and entertainment company rather than a
  software company: it publishes no developer program, no public API documentation and no
  machine-readable specifications.'
